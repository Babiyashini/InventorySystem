name: Deploy Pharmacy App to EC2

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          debug: true
          script: |
            echo "Starting deployment..."
            echo "Connected to EC2!"
            echo "Hostname: $(hostname)"
            
            # Navigate to project directory
            cd /home/ec2-user/InventorySystem || exit 1
            
            # Pull latest changes from git
            echo "Pulling latest code..."
            git pull origin main || git pull origin master
            
            # Build the Docker image
            echo "Building Docker image..."
            docker build -t pharmacy-app .
            
            # Stop and remove old container
            echo "Stopping old container..."
            docker stop pharmacy-app 2>/dev/null || true
            docker rm pharmacy-app 2>/dev/null || true
            
            # Run new container with RDS environment variables
            echo "Starting new container..."
            docker run -d \
              --name pharmacy-app \
              -p 5000:5000 \
              -e DB_HOST='pharmacy-inventory-dev-db.cmnkiqqqcwe5.us-east-1.rds.amazonaws.com' \
              -e DB_USER='pharmacy_admin' \
              -e DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              -e DB_NAME='pharmacy_db' \
              --restart unless-stopped \
              pharmacy-app
            
            # Wait for container to start
            sleep 5
            
            # Check if container is running
            if docker ps | grep -q pharmacy-app; then
              echo "Deployment successful! Container is running."
              echo "Container status:"
              docker ps | grep pharmacy-app
            else
              echo "Deployment failed! Container is not running."
              echo "Last 20 lines of logs:"
              docker logs pharmacy-app --tail 20
              exit 1
            fi
            
            # Test the application
            echo "Testing application..."
            if curl -s http://localhost:5000/check-flask | grep -q "Flask is alive"; then
              echo "Application is responding!"
            else
              echo "Application may not be responding correctly."
            fi
